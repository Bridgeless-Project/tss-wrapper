services:
  db:
    container_name: db
    image: postgres
    restart: unless-stopped
    ports:
      - "5435:5432"
    environment:
      - POSTGRES_USER=tss-wrapper
      - POSTGRES_PASSWORD=tss-wrapper
      - POSTGRES_DB=db
      - PGDATA=/pgdata
    volumes:
      - pg-data:/pgdata
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U tss-wrapper -d db" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

